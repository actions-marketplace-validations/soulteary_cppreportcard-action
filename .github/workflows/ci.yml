name: CI
on:
  push:
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
      - name: Unit tests and 95% coverage gate
        run: scripts/test-coverage.sh
      - run: go vet ./...
      - run: test -z "$(gofmt -l cmd internal)"
      - run: bash -n scripts/*.sh
      - run: scripts/test-prepare-release.sh
      - name: Install analyzers
        run: scripts/install-tools.sh
        env:
          LLVM_VERSION: '18'
      - run: scripts/integration.sh
      - name: Verify README badge example generation
        run: scripts/update-badge-example.sh
      - name: Upload README badge example
        uses: actions/upload-artifact@v4
        with:
          name: cppreportcard-example
          path: .github/cppreportcard-example/
          include-hidden-files: true
      - run: cmake -S testdata/cmake -B testdata/cmake/build
      - name: Smoke test local action
        uses: ./
        with:
          directory: testdata/cmake
          mode: full
          install_tools: 'false'
          compile_commands: build/compile_commands.json
      - name: Require complete smoke analysis
        if: always()
        run: |
          python3 - <<'PY'
          import json
          r = json.load(open('testdata/cmake/.cppreportcard/report.json'))
          assert r['analysis_complete'], r
          PY
      - name: Upload unit-test coverage
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-coverage
          path: coverage.out
          if-no-files-found: error
